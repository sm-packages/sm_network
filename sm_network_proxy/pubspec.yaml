name: sm_network_proxy
description: "Optional Android and iOS system proxy support for sm_network."
homepage: https://github.com/sm-packages/sm_network
repository: https://github.com/sm-packages/sm_network/tree/main/sm_network_proxy
issue_tracker: https://github.com/sm-packages/sm_network/issues
version: 0.1.0

environment:
  sdk: ">=3.5.4 <4.0.0"
  flutter: ">=3.24.5"

dependencies:
  dio: ">=5.9.2 <6.0.0"
  dio_http2_adapter: ">=2.6.0 <3.0.0"
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  sm_lints: ">=0.0.1 <3.0.0"

platforms:
  android:
  ios:

flutter:
  plugin:
    platforms:
      android:
        package: io.github.shay_wong.sm_network_proxy
        pluginClass: SmNetworkProxyPlugin
      ios:
        pluginClass: SmNetworkProxyPlugin
